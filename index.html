<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>番茄钟</title>

<!-- PWA Meta -->
<meta name="theme-color" content="#e74c3c" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="番茄钟">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<style>
  :root {
    --work-color: #e74c3c;
    --work-light: #fce4e4;
    --break-color: #2ecc71;
    --break-light: #e8f8e8;
    --bg: #f5f0eb;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --ring-bg: #ecf0f1;
    --shadow: 0 8px 32px rgba(0,0,0,0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    height: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    transition: background 0.5s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  body.break-mode { background: #eaf7ee; }

  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 36px 36px 28px;
    box-shadow: var(--shadow);
    text-align: center;
    width: 400px;
    max-width: 92vw;
    transition: box-shadow 0.3s, transform 0.3s;
    animation: cardIn 0.5s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card.shake {
    animation: cardShake 0.5s ease-out;
  }
  @keyframes cardShake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-6px); }
    30% { transform: translateX(6px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    90% { transform: translateX(2px); }
  }

  .mode-badge {
    display: inline-block;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 20px;
    background: var(--work-light);
    color: var(--work-color);
    transition: background 0.4s, color 0.4s, transform 0.3s;
  }
  body.break-mode .mode-badge {
    background: var(--break-light);
    color: var(--break-color);
  }
  .mode-badge.pop {
    animation: badgePop 0.4s ease-out;
  }
  @keyframes badgePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .timer-ring-wrap {
    position: relative;
    width: 240px; height: 240px;
    margin: 0 auto 20px;
    transition: transform 0.3s;
  }
  .timer-ring-wrap.running {
    animation: ringPulse 2s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  .timer-ring-wrap svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .ring-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 220px; height: 220px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .timer-ring-wrap.running .ring-glow {
    opacity: 0.35;
    animation: glowBreathe 2s ease-in-out infinite;
  }
  @keyframes glowBreathe {
    0%, 100% { opacity: 0.2; filter: blur(20px); }
    50% { opacity: 0.45; filter: blur(24px); }
  }
  .ring-bg {
    fill: none;
    stroke: var(--ring-bg);
    stroke-width: 8;
  }
  .ring-progress {
    fill: none;
    stroke: var(--work-color);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke 0.4s, stroke-dashoffset 0.35s linear;
  }
  body.break-mode .ring-progress { stroke: var(--break-color); }

  .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    letter-spacing: 2px;
    transition: transform 0.15s;
  }
  .time-display.flip {
    animation: timeFlip 0.2s ease-out;
  }
  @keyframes timeFlip {
    0% { transform: translate(-50%, -50%) scale(1.08); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .session-count {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }

  .presets {
    margin-bottom: 18px;
  }
  .preset-label {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .preset-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .preset-chip {
    border: 1.5px solid #e0e0e0;
    border-radius: 16px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: #fff;
    color: var(--text-secondary);
    transition: all 0.2s;
    letter-spacing: 0.3px;
    min-height: 32px;
    -webkit-tap-highlight-color: transparent;
  }
  .preset-chip:active { transform: scale(0.95); }
  .preset-chip.active {
    border-color: var(--work-color);
    background: var(--work-light);
    color: var(--work-color);
    font-weight: 600;
  }
  body.break-mode .preset-chip.active {
    border-color: var(--break-color);
    background: var(--break-light);
    color: var(--break-color);
  }
  .preset-chip.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .sound-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
  }
  .sound-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin-right: 4px;
  }
  .sound-btn {
    border: 1.5px solid #e0e0e0;
    border-radius: 14px;
    padding: 4px 10px;
    font-size: 18px;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .sound-btn:active { transform: scale(0.93); }
  .sound-btn.active {
    border-color: #888;
    background: #f5f5f5;
  }
  .sound-btn.muted {
    opacity: 0.4;
  }
  .sound-btn.muted.active {
    border-color: #e0e0e0;
    background: #fff;
  }

  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.3s, color 0.3s;
    letter-spacing: 0.5px;
    min-height: 48px;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--work-color);
    color: #fff;
    min-width: 110px;
    box-shadow: 0 4px 14px rgba(231,76,60,0.35);
    transition: background 0.3s, box-shadow 0.3s, transform 0.15s;
  }
  body.break-mode .btn-primary {
    background: var(--break-color);
    box-shadow: 0 4px 14px rgba(46,204,113,0.35);
  }
  .btn-secondary {
    background: var(--ring-bg);
    color: var(--text);
  }
  .btn-secondary:hover { background: #d5dde5; }
  .btn-secondary:active { background: #d5dde5; }

  .page-title {
    font-size: 12px;
    color: #c8cfd4;
    margin-top: 20px;
    letter-spacing: 2px;
  }

  /* Alert modal */
  .alert-backdrop {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    animation: backdropIn 0.3s ease-out;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .alert-backdrop.closing {
    animation: backdropOut 0.25s ease-in forwards;
  }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes backdropOut { from { opacity: 1; } to { opacity: 0; } }

  .alert-dialog {
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px 28px;
    text-align: center;
    max-width: 320px;
    width: 85vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: dialogIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .alert-backdrop.closing .alert-dialog {
    animation: dialogOut 0.2s ease-in forwards;
  }
  @keyframes dialogIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes dialogOut {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(0.85); opacity: 0; }
  }
  .alert-icon { font-size: 48px; margin-bottom: 10px; }
  .alert-title {
    font-size: 20px; font-weight: 700;
    color: var(--text); margin-bottom: 6px;
  }
  .alert-subtitle {
    font-size: 14px; color: var(--text-secondary);
    margin-bottom: 24px;
  }
  .alert-btn {
    border: none; border-radius: 12px;
    padding: 12px 40px;
    font-size: 16px; font-weight: 600;
    cursor: pointer; color: #fff;
    background: var(--work-color);
    transition: transform 0.15s, background 0.3s;
    letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
  }
  body.break-mode .alert-btn { background: var(--break-color); }
  .alert-btn:active { transform: scale(0.95); }

  /* Celebration particles */
  .particles-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1000;
  }
  .particle {
    position: absolute;
    font-size: 20px;
    animation: particleFly 1.2s ease-out forwards;
    pointer-events: none;
  }
  @keyframes particleFly {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot));
    }
  }

  /* Theme selector */
  .theme-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 18px;
  }
  .theme-label {
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin-right: 2px;
  }
  .theme-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2.5px solid #e0e0e0;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .theme-dot:active { transform: scale(0.88); }
  .theme-dot.active {
    border-color: #555;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.08);
  }
  .theme-dot.red { background: linear-gradient(135deg, #e74c3c 50%, #2ecc71 50%); }
  .theme-dot.blue { background: linear-gradient(135deg, #3498db 50%, #1abc9c 50%); }
  .theme-dot.orange { background: linear-gradient(135deg, #e67e22 50%, #9b59b6 50%); }

  /* Mobile: small phones */
  @media (max-width: 420px) {
    .card {
      padding: 28px 18px 20px;
      border-radius: 20px;
      width: 100%;
      max-width: 100vw;
      margin: 0 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .timer-ring-wrap {
      width: 200px; height: 200px;
      margin-bottom: 16px;
    }
    .ring-glow {
      width: 180px; height: 180px;
    }
    .time-display { font-size: 44px; }
    .mode-badge {
      font-size: 12px;
      padding: 5px 14px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 13px 22px;
      font-size: 15px;
      min-height: 48px;
      border-radius: 14px;
    }
    .btn-primary { min-width: 90px; }
    .session-count { font-size: 12px; margin-bottom: 14px; }
    .page-title { font-size: 11px; margin-top: 16px; }
    .buttons { gap: 10px; }
    .preset-label { font-size: 10px; margin-bottom: 4px; }
    .preset-chip { padding: 4px 10px; font-size: 12px; border-radius: 14px; }
    .presets { margin-bottom: 14px; }
    .sound-row { margin-bottom: 16px; }
  }

  @media (min-width: 421px) and (max-width: 768px) {
    .card { padding: 36px 28px 24px; }
    .timer-ring-wrap { width: 220px; height: 220px; }
    .ring-glow { width: 200px; height: 200px; }
    .time-display { font-size: 50px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="mode-badge" id="modeBadge">工作中</div>

  <div class="timer-ring-wrap" id="timerRingWrap">
    <div class="ring-glow" id="ringGlow" style="background: radial-gradient(circle, var(--work-color) 0%, transparent 70%);"></div>
    <svg width="240" height="240" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="108"/>
      <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="108"
              stroke-dasharray="678.584" stroke-dashoffset="0"/>
    </svg>
    <div class="time-display" id="timeDisplay">25:00</div>
  </div>

  <div class="session-count" id="sessionCount">已完成 0 个番茄</div>

  <div class="presets">
    <div class="preset-label">工作时间</div>
    <div class="preset-row" id="workPresets">
      <button class="preset-chip" data-min="0.5">30 秒</button>
      <button class="preset-chip" data-min="15">15 分钟</button>
      <button class="preset-chip active" data-min="25">25 分钟</button>
      <button class="preset-chip" data-min="45">45 分钟</button>
      <button class="preset-chip" data-min="60">60 分钟</button>
    </div>
  </div>

  <div class="presets">
    <div class="preset-label">休息时间</div>
    <div class="preset-row" id="breakPresets">
      <button class="preset-chip active" data-min="5">5 分钟</button>
      <button class="preset-chip" data-min="10">10 分钟</button>
      <button class="preset-chip" data-min="15">15 分钟</button>
    </div>
  </div>

  <div class="theme-row" id="themeRow">
    <span class="theme-label">主题</span>
    <button class="theme-dot red active" data-theme="classic"></button>
    <button class="theme-dot blue" data-theme="ocean"></button>
    <button class="theme-dot orange" data-theme="sunset"></button>
  </div>

  <div class="sound-row">
    <span class="sound-label">提示音</span>
    <button class="sound-btn active" data-sound="classic" title="经典">&#x1F514;</button>
    <button class="sound-btn" data-sound="chime" title="风铃">&#x1F3B5;</button>
    <button class="sound-btn" data-sound="digital" title="电子">&#x1F4F3;</button>
    <button class="sound-btn muted" data-sound="none" title="静音">&#x1F507;</button>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" id="btnToggle" onclick="toggleTimer()">开始</button>
    <button class="btn btn-secondary" id="btnReset" onclick="resetTimer()">重置</button>
  </div>

  <div class="page-title">POMODORO</div>
</div>

<!-- Alert modal -->
<div class="alert-backdrop" id="alertBackdrop" style="display:none;">
  <div class="alert-dialog">
    <div class="alert-icon" id="alertIcon"></div>
    <div class="alert-title" id="alertTitle"></div>
    <div class="alert-subtitle" id="alertSubtitle"></div>
    <button class="alert-btn" id="alertDismissBtn">知道了</button>
  </div>
</div>

<div class="particles-container" id="particlesContainer"></div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 108;

// --- State ---
let isWork = true;
let remaining = 25 * 60;
let totalDuration = 25 * 60;
let workDuration = 25 * 60;
let breakDuration = 5 * 60;
let timerId = null;
let cycleCount = parseInt(localStorage.getItem('pomodoroCycles') || '0', 10);
let soundType = localStorage.getItem('pomodoroSound') || 'classic';
let lastDisplayedMinute = -1;

let alertLoopId = null;

// --- Themes ---
const THEMES = {
  classic: { work: '#e74c3c', workLight: '#fce4e4', break: '#2ecc71', breakLight: '#e8f8e8', breakBg: '#eaf7ee' },
  ocean:   { work: '#3498db', workLight: '#e8f4fd', break: '#1abc9c', breakLight: '#e8f8f5', breakBg: '#e8f6f3' },
  sunset:  { work: '#e67e22', workLight: '#fdf2e9', break: '#9b59b6', breakLight: '#f4ecf7', breakBg: '#f5f0f6' },
};
let currentTheme = localStorage.getItem('pomodoroTheme') || 'classic';

// --- DOM refs ---
const card = document.getElementById('card');
const modeBadge = document.getElementById('modeBadge');
const ringProgress = document.getElementById('ringProgress');
const ringGlow = document.getElementById('ringGlow');
const timeDisplay = document.getElementById('timeDisplay');
const sessionCount = document.getElementById('sessionCount');
const btnToggle = document.getElementById('btnToggle');
const themeMeta = document.getElementById('themeMeta');
const timerRingWrap = document.getElementById('timerRingWrap');
const particlesContainer = document.getElementById('particlesContainer');

// --- Helper ---
function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// --- Update UI ---
function updateUI(forceFlip) {
  var m = Math.floor(remaining / 60);
  var s = remaining % 60;
  timeDisplay.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

  if (forceFlip || (m !== lastDisplayedMinute && s === 0)) {
    timeDisplay.classList.remove('flip');
    void timeDisplay.offsetWidth;
    timeDisplay.classList.add('flip');
  }
  lastDisplayedMinute = m;

  var fraction = remaining / totalDuration;
  ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);

  document.body.classList.toggle('break-mode', !isWork);
  var t = THEMES[currentTheme];
  ringGlow.style.background = isWork
    ? 'radial-gradient(circle, ' + hexToRgba(t.work, 0.5) + ' 0%, transparent 70%)'
    : 'radial-gradient(circle, ' + hexToRgba(t.break, 0.5) + ' 0%, transparent 70%)';
  document.body.style.background = isWork ? 'var(--bg)' : t.breakBg;

  if (isWork) {
    modeBadge.textContent = '工作中';
    themeMeta.content = t.work;
  } else {
    modeBadge.textContent = '休息中';
    themeMeta.content = t.break;
  }

  sessionCount.textContent = '已完成 ' + cycleCount + ' 个番茄';
}

// --- Timer controls ---
function toggleTimer() {
  if (timerId) { pauseTimer(); } else { startTimer(); }
}

function startTimer() {
  timerId = setInterval(tick, 1000);
  btnToggle.textContent = '暂停';
  timerRingWrap.classList.add('running');
  setPresetsEnabled(false);
}

function pauseTimer() {
  clearInterval(timerId);
  timerId = null;
  btnToggle.textContent = '开始';
  timerRingWrap.classList.remove('running');
  setPresetsEnabled(true);
}

function tick() {
  remaining--;
  updateUI();
  if (remaining <= 0) {
    clearInterval(timerId);
    timerId = null;
    timerRingWrap.classList.remove('running');
    celebrate();
    card.classList.add('shake');
    setTimeout(function() { card.classList.remove('shake'); }, 500);
    modeBadge.classList.add('pop');
    setTimeout(function() { modeBadge.classList.remove('pop'); }, 400);
    switchMode();
    updateUI(true);
    btnToggle.textContent = '开始';
    setPresetsEnabled(true);
    showAlert();
  }
}

function switchMode() {
  if (isWork) {
    cycleCount++;
    localStorage.setItem('pomodoroCycles', cycleCount);
  }
  isWork = !isWork;
  totalDuration = isWork ? workDuration : breakDuration;
  remaining = totalDuration;

  // Update preset active states
  document.querySelectorAll('#workPresets .preset-chip').forEach(function(chip) {
    var min = parseFloat(chip.dataset.min);
    chip.classList.toggle('active', isWork && min * 60 === workDuration);
  });
  document.querySelectorAll('#breakPresets .preset-chip').forEach(function(chip) {
    var min = parseFloat(chip.dataset.min);
    chip.classList.toggle('active', !isWork && min * 60 === breakDuration);
  });
}

function resetTimer() {
  clearInterval(timerId);
  timerId = null;
  stopAlertLoop();
  var backdrop = document.getElementById('alertBackdrop');
  if (backdrop.style.display !== 'none') { backdrop.style.display = 'none'; }
  isWork = true;
  totalDuration = workDuration;
  remaining = workDuration;
  btnToggle.textContent = '开始';
  timerRingWrap.classList.remove('running');
  setPresetsEnabled(true);
  updateUI();
  // Reset preset highlight
  document.querySelectorAll('#workPresets .preset-chip').forEach(function(chip) {
    chip.classList.toggle('active', parseFloat(chip.dataset.min) * 60 === workDuration);
  });
  document.querySelectorAll('#breakPresets .preset-chip').forEach(function(chip) {
    chip.classList.toggle('active', parseFloat(chip.dataset.min) * 60 === breakDuration);
  });
}

// --- Presets ---
function setPresetsEnabled(enabled) {
  document.querySelectorAll('.preset-chip').forEach(function(chip) {
    chip.classList.toggle('disabled', !enabled);
  });
}

document.getElementById('workPresets').addEventListener('click', function(e) {
  var chip = e.target.closest('.preset-chip');
  if (!chip || chip.classList.contains('disabled') || timerId || !isWork) return;
  var min = parseFloat(chip.dataset.min);
  workDuration = min * 60;
  totalDuration = workDuration;
  remaining = workDuration;
  document.querySelectorAll('#workPresets .preset-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
  updateUI();
});

document.getElementById('breakPresets').addEventListener('click', function(e) {
  var chip = e.target.closest('.preset-chip');
  if (!chip || chip.classList.contains('disabled') || timerId) return;
  var min = parseFloat(chip.dataset.min);
  breakDuration = min * 60;
  if (!isWork) {
    totalDuration = breakDuration;
    remaining = breakDuration;
    updateUI();
  }
  document.querySelectorAll('#breakPresets .preset-chip').forEach(function(c) { c.classList.remove('active'); });
  chip.classList.add('active');
});

// --- Sound engine ---
function bellTone(ctx, freq, startTime, duration, volume) {
  // Inharmonic bell partials with pitch glide and detuning for natural sound
  var partials = [
    { ratio: 1.0,   gain: 1.0,  detune: 0 },
    { ratio: 2.4,   gain: 0.55, detune: 5 },
    { ratio: 5.2,   gain: 0.30, detune: -3 },
    { ratio: 7.1,   gain: 0.15, detune: 8 },
  ];
  partials.forEach(function(p) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    var f = freq * p.ratio;
    osc.frequency.setValueAtTime(f + p.detune, startTime);
    osc.frequency.exponentialRampToValueAtTime(f * 0.7, startTime + duration * 0.3);
    gain.gain.setValueAtTime(volume * p.gain * 0.6, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.1);
  });
}

function chimeNote(ctx, freq, startTime, duration, volume) {
  // Wind chime: brighter harmonics, longer sustain, slight detune for airiness
  var partials = [
    { ratio: 1.0,   gain: 1.0,  detune: 12 },
    { ratio: 2.76,  gain: 0.5,  detune: -7 },
    { ratio: 5.4,   gain: 0.25, detune: 15 },
  ];
  partials.forEach(function(p) {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    var f = freq * p.ratio;
    osc.frequency.setValueAtTime(f + p.detune, startTime);
    gain.gain.setValueAtTime(volume * p.gain * 0.4, startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.15);
  });
}

function digitalTone(ctx, freq, startTime, duration, volume) {
  // Clean modern notification: carrier + subtle FM modulation
  var mod = ctx.createOscillator();
  var modGain = ctx.createGain();
  var car = ctx.createOscillator();
  var outGain = ctx.createGain();
  mod.connect(modGain);
  modGain.connect(car.frequency);
  car.connect(outGain);
  outGain.connect(ctx.destination);

  mod.type = 'sine';
  mod.frequency.setValueAtTime(freq * 3, startTime);
  car.type = 'sine';
  car.frequency.setValueAtTime(freq, startTime);
  modGain.gain.setValueAtTime(freq * 0.3, startTime);
  modGain.gain.exponentialRampToValueAtTime(1, startTime + duration * 0.5);
  outGain.gain.setValueAtTime(volume * 0.5, startTime);
  outGain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

  mod.start(startTime);
  mod.stop(startTime + duration + 0.05);
  car.start(startTime);
  car.stop(startTime + duration + 0.05);
}

function getAudioCtx() {
  return new (window.AudioContext || window.webkitAudioContext)();
}

function playSound() {
  if (soundType === 'none') return;
  try {
    var ctx = getAudioCtx();
    var t = ctx.currentTime;

    if (soundType === 'classic') {
      [587, 784, 988].forEach(function(freq, i) {
        bellTone(ctx, freq, t + i * 0.35, 0.45, 0.7);
      });
    } else if (soundType === 'chime') {
      [523, 659, 784, 1047, 1319].forEach(function(freq, i) {
        chimeNote(ctx, freq, t + i * 0.22, 0.8, 0.5);
      });
    } else if (soundType === 'digital') {
      [440, 523, 659].forEach(function(freq, i) {
        digitalTone(ctx, freq, t + i * 0.15, 0.25, 0.55);
      });
    }
  } catch(e) { /* audio not available */ }
}

// --- Alert modal with looping sound ---
function getSoundLoopInterval() {
  if (soundType === 'chime') return 2200;
  if (soundType === 'digital') return 1400;
  return 2500; // classic
}

function startAlertLoop() {
  if (soundType !== 'none') {
    playSound();
    alertLoopId = setInterval(playSound, getSoundLoopInterval());
  }
}

function stopAlertLoop() {
  if (alertLoopId) {
    clearInterval(alertLoopId);
    alertLoopId = null;
  }
}

function showAlert() {
  var wasWork = !isWork; // switchMode already flipped it
  document.getElementById('alertIcon').textContent = wasWork ? '🍅' : '☕';
  document.getElementById('alertTitle').textContent = wasWork ? '工作完成！' : '休息结束！';
  document.getElementById('alertSubtitle').textContent = wasWork
    ? '太棒了，休息一下吧 ~'
    : '休息好了，继续加油！';
  document.getElementById('alertBackdrop').style.display = 'flex';
  startAlertLoop();
}

function dismissAlert() {
  var backdrop = document.getElementById('alertBackdrop');
  backdrop.classList.add('closing');
  stopAlertLoop();
  setTimeout(function() {
    backdrop.style.display = 'none';
    backdrop.classList.remove('closing');
  }, 250);
}

function previewSound(type) {
  if (type === 'none') return;
  try {
    var ctx = getAudioCtx();
    var t = ctx.currentTime;

    if (type === 'classic') {
      // Preview: single bell strike
      bellTone(ctx, 784, t, 0.5, 0.6);
    } else if (type === 'chime') {
      // Preview: two chime notes
      [659, 1047].forEach(function(freq, i) {
        chimeNote(ctx, freq, t + i * 0.18, 0.55, 0.45);
      });
    } else if (type === 'digital') {
      // Preview: single digital ping
      digitalTone(ctx, 523, t, 0.3, 0.5);
      digitalTone(ctx, 659, t + 0.12, 0.25, 0.4);
    }
  } catch(e) { /* audio not available */ }
}

// --- Sound selection ---
document.querySelector('.sound-row').addEventListener('click', function(e) {
  var btn = e.target.closest('.sound-btn');
  if (!btn) return;
  soundType = btn.dataset.sound;
  localStorage.setItem('pomodoroSound', soundType);
  document.querySelectorAll('.sound-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  previewSound(soundType);
});

// Set initial sound button state
document.querySelector('.sound-btn[data-sound="' + soundType + '"]').classList.add('active');

// --- Theme ---
function applyTheme(name) {
  currentTheme = name;
  localStorage.setItem('pomodoroTheme', name);
  var t = THEMES[name];
  document.documentElement.style.setProperty('--work-color', t.work);
  document.documentElement.style.setProperty('--work-light', t.workLight);
  document.documentElement.style.setProperty('--break-color', t.break);
  document.documentElement.style.setProperty('--break-light', t.breakLight);
  document.querySelectorAll('.theme-dot').forEach(function(d) { d.classList.remove('active'); });
  document.querySelector('.theme-dot[data-theme="' + name + '"]').classList.add('active');
  updateUI();
}

document.getElementById('themeRow').addEventListener('click', function(e) {
  var dot = e.target.closest('.theme-dot');
  if (!dot) return;
  applyTheme(dot.dataset.theme);
});

// Init theme
applyTheme(currentTheme);

// --- Alert dismiss handlers ---
document.getElementById('alertDismissBtn').addEventListener('click', dismissAlert);
document.getElementById('alertBackdrop').addEventListener('click', function(e) {
  if (e.target === this) dismissAlert();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') dismissAlert();
});

// --- Celebration particles ---
function celebrate() {
  var emojis = isWork ? ['🍅', '✨', '🎯', '💪', '⭐', '🔥'] : ['☕', '🌿', '🎉', '😌', '💚', '🌸'];
  var rect = card.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;

  for (var i = 0; i < 18; i++) {
    var particle = document.createElement('span');
    particle.className = 'particle';
    particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    particle.style.left = cx + 'px';
    particle.style.top = cy + 'px';
    var angle = Math.random() * Math.PI * 2;
    var dist = 60 + Math.random() * 120;
    particle.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    particle.style.setProperty('--dy', Math.sin(angle) * dist - 40 - Math.random() * 60 + 'px');
    particle.style.setProperty('--rot', (Math.random() - 0.5) * 360 + 'deg');
    particle.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
    particle.style.fontSize = (16 + Math.random() * 14) + 'px';
    particlesContainer.appendChild(particle);
    setTimeout(function() { particle.remove(); }, 1600);
  }
}

// --- PWA ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function() {});
}

// --- Init ---
updateUI();
</script>
